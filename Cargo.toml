[package]
name = "rs-tars2sqlite4wasi"
version = "0.1.0"
edition = "2024"

description = "Convert tar(.gz) files to SQLite tables"
license = "Apache-2.0"
repository = "https://github.com/takanoriyanagitani/rs-tars2sqlite4wasi"
homepage = "https://github.com/takanoriyanagitani/rs-tars2sqlite4wasi"
documentation = "https://docs.rs/rs-tars2sqlite4wasi/latest"
keywords = ["tar", "sqlite", "wasi", "convert", "archive"]

exclude = [
  "tars2sqlite4wasi.wasm",
  "sample.d/",
]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"

[profile.release-wasi]
inherits = "release"
lto = true
strip = true
opt-level = 's'
codegen-units = 1

[[bin]]
name = "tars2sqlite4wasi"

[dependencies.rusqlite]
version = "0.40.2"
default-features = false
features = [
    "bundled",
    "wasm32-wasi-vfs",
]

[dependencies.flate2]
version = "1.1.10"
default-features = false
features = [
  "rust_backend",
]

[dependencies.tar]
version = "0.4.46"
default-features = false
features = [
]
